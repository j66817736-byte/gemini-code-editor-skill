name: Validate skill catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate catalog and skill files
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path(".")
          catalog_path = root / "skills/catalog.json"
          if not catalog_path.is_file():
              raise SystemExit("ERROR: skills/catalog.json is missing")

          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          skills = catalog.get("skills")
          if not isinstance(skills, list) or not skills:
              raise SystemExit("ERROR: catalog.skills must be a non-empty list")

          names = [item.get("name") for item in skills]
          if any(not isinstance(name, str) or not name.strip() for name in names):
              raise SystemExit("ERROR: every skill needs a non-empty name")
          if len(names) != len(set(names)):
              raise SystemExit("ERROR: duplicate skill names in catalog")

          known = set(names)
          errors = []
          for item in skills:
              name = item["name"]
              rel = item.get("path")
              if not isinstance(rel, str) or not rel.strip():
                  errors.append(f"{name}: missing path")
                  continue
              path = (root / rel).resolve()
              if root.resolve() not in path.parents:
                  errors.append(f"{name}: path escapes repository")
                  continue
              if not path.is_file():
                  errors.append(f"{name}: file not found: {rel}")
                  continue

              content = path.read_text(encoding="utf-8")
              match = re.match(r"^---\\s*\\n(.*?)\\n---\\s*\\n", content, re.S)
              if not match:
                  errors.append(f"{name}: missing YAML frontmatter")
                  continue
              frontmatter = match.group(1)
              declared_name = re.search(r"^name:\\s*([^\\n]+)\\s*$", frontmatter, re.M)
              description = re.search(r"^description:\\s*(.+)\\s*$", frontmatter, re.M)
              if not declared_name or declared_name.group(1).strip().strip("\\\"'") != name:
                  errors.append(f"{name}: frontmatter name does not match catalog")
              if not description or not description.group(1).strip():
                  errors.append(f"{name}: missing frontmatter description")

              dependencies = item.get("requires", [])
              if not isinstance(dependencies, list):
                  errors.append(f"{name}: requires must be a list")
              else:
                  for dependency in dependencies:
                      if dependency not in known:
                          errors.append(f"{name}: unknown dependency {dependency}")

          if errors:
              print("\\n".join(f"- {error}" for error in errors))
              raise SystemExit(1)

          print(f"Validated {len(skills)} skills: catalog paths, metadata, and dependencies are consistent.")
          PY
